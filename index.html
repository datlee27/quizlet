<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizlet MLN111 — Ôn Tập Triết Học</title>
  <meta name="description" content="598 câu hỏi trắc nghiệm Triết học MLN111 - Ôn tập hiệu quả với 12 bộ đề">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <button id="btn-back" class="btn-back hidden" aria-label="Quay lại trang chủ">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span>Trang chủ</span>
        </button>
        <div class="logo" id="logo-home">
          <span class="logo-icon">📖</span>
          <h1>MLN111 <span class="logo-sub">Triết Học</span></h1>
        </div>
        <div class="header-stats" id="header-stats"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Home View -->
      <section id="view-home" class="view active">
        <div class="hero">
          <h2 class="hero-title">598 Câu Hỏi Trắc Nghiệm</h2>
          <p class="hero-subtitle">Chia thành 12 bộ đề • Ôn tập hiệu quả • Lưu tiến độ tự động</p>
        </div>
        <div class="exam-grid" id="exam-grid"></div>
      </section>

      <!-- Quiz View -->
      <section id="view-quiz" class="view">
        <div class="quiz-container">
          <div class="quiz-nav-bar">
            <button id="btn-quiz-back" class="btn-quiz-back" title="Quay lại danh sách đề">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
              <span>Về danh sách đề</span>
            </button>
            <span id="quiz-mode-tag" class="quiz-mode-tag"></span>
          </div>

          <div class="quiz-progress">
            <div class="progress-info">
              <span id="quiz-title" class="quiz-title"></span>
              <span id="quiz-counter" class="quiz-counter"></span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>

          <div class="flashcard-wrapper">
            <div class="flashcard" id="flashcard">
              <!-- Front -->
              <div class="flashcard-front" id="card-front">
                <div class="question-badge" id="question-badge"></div>
                <p class="question-text" id="question-text"></p>
                <div class="options-list" id="options-list"></div>
                <div class="multi-confirm-wrapper hidden" id="multi-confirm-wrapper">
                  <button class="btn btn-confirm-multi" id="btn-confirm-multi" disabled>
                    ✓ Xác nhận câu trả lời (<span id="multi-count">0</span> đã chọn)
                  </button>
                </div>
              </div>
              <!-- Back -->
              <div class="flashcard-back" id="card-back">
                <div class="result-icon" id="result-icon"></div>
                <p class="question-text-back" id="question-text-back"></p>
                <div class="answer-review" id="answer-review"></div>
                <div class="note-box" id="note-box"></div>
              </div>
            </div>
          </div>

          <div class="quiz-actions" id="quiz-actions">
            <button class="btn btn-next" id="btn-next">
              Câu tiếp theo
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Result View -->
      <section id="view-result" class="view">
        <div class="result-container" id="result-container">
          <div class="result-card">
            <div class="result-header">
              <div class="result-emoji" id="result-emoji"></div>
              <h2 class="result-title" id="result-title"></h2>
              <p class="result-subtitle" id="result-subtitle"></p>
            </div>

            <div class="score-circle-wrapper">
              <div class="score-circle" id="score-circle">
                <svg viewBox="0 0 120 120">
                  <circle class="score-bg" cx="60" cy="60" r="54"/>
                  <circle class="score-fill" id="score-fill" cx="60" cy="60" r="54"/>
                </svg>
                <div class="score-text">
                  <span class="score-num" id="score-num">0</span>
                  <span class="score-total" id="score-total">/50</span>
                </div>
              </div>
            </div>

            <div class="result-stats" id="result-stats"></div>

            <div class="result-buttons">
              <button class="btn btn-review-wrong" id="btn-review-wrong">
                🔴 Học lại câu sai
              </button>
              <button class="btn btn-review-correct" id="btn-review-correct">
                🟢 Ôn lại câu đúng
              </button>
              <button class="btn btn-restart" id="btn-restart">
                🔄 Làm lại bộ đề này từ đầu
              </button>
              <button class="btn btn-home" id="btn-result-home">
                🏠 Về danh sách đề
              </button>
            </div>

            <div class="review-list" id="review-list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
